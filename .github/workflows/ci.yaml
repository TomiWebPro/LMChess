name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly Windows gate at 06:00 UTC — §11.3 spec
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ubuntu-gate:
    name: Ubuntu Gate (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test coverage (§11.4)
        # Coverage is explicitly NOT the success metric (§11.4): the goal is
        # that every interaction-matrix control is exercised and every
        # transition asserts the semantics invariants — not a line-coverage
        # number. This step only generates the lcov.info artifact so coverage
        # trends CAN be reported; it never gates the build.
        continue-on-error: true
        run: flutter test test/ui --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  windows-nightly:
    name: Windows Nightly Gate (§11.3)
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Unit & widget tests
        run: flutter test

      - name: Integration test (§9.1)
        id: integration-test
        run: |
          $ErrorActionPreference = "Continue"
          $result = flutter test integration_test/accessibility_windows_test.dart -d windows 2>&1
          echo "--- INTEGRATION TEST OUTPUT ---"
          Write-Host $result
          echo "exit_code=$($LASTEXITCODE)" >> $env:GITHUB_OUTPUT
          # Fail the job on ANY non-zero exit — a red §9.1 integration test
          # must gate the release, not just the smoke crash path (§11.3).
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Windows integration test failed with exit code $LASTEXITCODE"
            Exit $LASTEXITCODE
          }
        env:
          FLUTTER_TEST_DEVICE_TIMEOUT: 180000

      - name: Run UIA smoke (§9.2)
        id: uia-smoke
        run: |
          $exePath = "build\windows\x64\runner\Release\llm_chess_arena.exe"
          $outputFile = "uia_smoke_output.txt"
          $eventViewerFile = "event_viewer_excerpt.txt"

          if (-not (Test-Path $exePath)) {
            Write-Host "ERROR: Release executable not found at $exePath"
            Write-Host "Exit code 1 — exe missing/build needed"
            Exit 1
          }

          # The smoke script owns the app lifecycle (§9.2 steps 3 + 8): it
          # launches the exe itself via Start-Process -PassThru and always
          # kills the process in its own finally block. Do NOT launch a
          # second instance here — a double launch would split UIA
          # attachment and seeded random clicks between two windows (§11.3).
          Write-Host "Running UIA smoke test (script launches and cleans up the app)..."
          $scriptResult = powershell -ExecutionPolicy Bypass -File tool/windows_accessibility_smoke.ps1 `
            -Exe $exePath `
            -RandomClicks 500 `
            -Timeout 120 `
            -PauseMs 200 2>&1

          Write-Host "--- UIA SMOKE OUTPUT ---"
          Write-Host $scriptResult

          $scriptResult | Out-File -FilePath $outputFile

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Smoke test failed (exit code $LASTEXITCODE) — exporting Event Viewer excerpt for debugging"
            # Export recent application error entries for debugging
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} |
              Select-Object TimeCreated, ProviderName, Message |
              Format-List |
              Out-File -FilePath $eventViewerFile -Force
          }

          # Record exit code
          echo "exit_code=$($LASTEXITCODE)" >> $env:GITHUB_OUTPUT

          # Fail the job on ANY non-zero exit — 0=pass, 1=exe/app failure,
          # 2=crash detected in Event Viewer (§9.2). A silent smoke step
          # must never green-light a broken native gate (§11.3).
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::UIA smoke failed with exit code $LASTEXITCODE"
            Exit $LASTEXITCODE
          }

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uia-smoke-artifacts
          path: |
            uia_smoke_output.txt
            event_viewer_excerpt.txt
          retention-days: 30
